apiVersion: v1
kind: Service
metadata:
  name: bramly-sample-nodejs
  labels:
    app: bramly-sample-nodejs
spec:
  # ClusterIP provides a stable internal IP and cluster-internal DNS name
  # so other pods or Ingress can reach the application without tracking changing pod IPs.
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  # The selector connects this Service to pods having the label 'app: bramly-sample-nodejs'
  selector:
    app: bramly-sample-nodejs
