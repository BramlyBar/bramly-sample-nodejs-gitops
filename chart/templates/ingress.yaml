apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bramly-sample-nodejs
  labels:
    app: bramly-sample-nodejs
spec:
  # Ingress acts as the entry point from outside the cluster, routing HTTP requests
  # arriving at 'bramly-sample-nodejs.local' down to our internal ClusterIP Service on port 8080.
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: {{ .Values.ingress.path | default "/" }}
            pathType: Prefix
            backend:
              service:
                name: bramly-sample-nodejs
                port:
                  number: {{ .Values.service.port }}
